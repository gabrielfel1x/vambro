name: Security Check

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'src/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'src/**'
  workflow_dispatch:
  schedule:
    # Executa toda segunda-feira às 9h UTC e toda sexta às 17h
    - cron: '0 9 * * 1'
    - cron: '0 17 * * 5'

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    name: Verificar Dependências
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Install dependencies
      run: npm install
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
    - name: Check for outdated packages
      run: |
        echo "Verificando pacotes desatualizados..."
        npm outdated || true
        npm outdated --json > outdated-packages.json || true
        
    - name: Run npm audit
      run: |
        echo "Executando auditoria de segurança..."
        npm audit --audit-level=moderate || true
        npm audit --json > npm-audit-report.json || true
        
    - name: Check for known vulnerabilities
      run: |
        echo "Verificando vulnerabilidades conhecidas..."
        npx audit-ci --moderate || true
        
    - name: Check dependency licenses
      run: |
        echo "Verificando licenças das dependências..."
        npx license-checker --json > license-report.json || true
        
    - name: Upload audit report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-audit-report
        path: |
          npm-audit-report.json
          outdated-packages.json
          license-report.json
          package-lock.json

  code-scan:
    runs-on: ubuntu-latest
    name: Análise de Código
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run ESLint
      run: |
        echo "Executando análise de código..."
        npx eslint . --ext .js,.jsx --format json --output-file eslint-report.json || true
        
    - name: Check for hardcoded secrets
      run: |
        echo "Verificando possíveis segredos expostos..."
        grep -r "password\|secret\|api_key\|token\|PRIVATE_KEY" --include="*.js" --include="*.json" --include="*.env" src/ || true
        
    - name: Check for SQL injection patterns
      run: |
        echo "Verificando padrões de SQL injection..."
        grep -r "query.*\+.*\$" --include="*.js" src/ || true
        
    - name: Upload scan reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: code-scan-reports
        path: eslint-report.json

  container-scan:
    runs-on: ubuntu-latest
    name: Scan de Container
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Build Docker image
      run: |
        echo "FROM node:14" > Dockerfile.test
        echo "WORKDIR /app" >> Dockerfile.test
        echo "COPY package*.json ./" >> Dockerfile.test
        echo "RUN npm install" >> Dockerfile.test
        docker build -f Dockerfile.test -t test-image .
      continue-on-error: true
      
    - name: Scan image for vulnerabilities
      run: |
        echo "Escaneando imagem Docker..."
        # Simulação de scan
        docker images | grep test-image || true

