name: Security Check

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
  pull_request:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
  workflow_dispatch:
  schedule:
    # Executa toda segunda-feira às 9h UTC
    - cron: '0 9 * * 1'

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    name: Verificar Dependências
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
      
    - name: Check for outdated packages
      run: |
        echo "Verificando pacotes desatualizados..."
        npm outdated || true
        
    - name: Run npm audit
      run: |
        echo "Executando auditoria de segurança..."
        npm audit --audit-level=moderate || true
        npm audit --json > npm-audit-report.json || true
        
    - name: Check for known vulnerabilities
      run: |
        echo "Verificando vulnerabilidades conhecidas..."
        npx audit-ci --moderate || true
        
    - name: Upload audit report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-audit-report
        path: |
          npm-audit-report.json
          package-lock.json

  code-scan:
    runs-on: ubuntu-latest
    name: Análise de Código
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run ESLint
      run: |
        echo "Executando análise de código..."
        npx eslint . --ext .js,.jsx || true
        
    - name: Check for hardcoded secrets
      run: |
        echo "Verificando possíveis segredos expostos..."
        # Simulação de verificação de segredos
        grep -r "password\|secret\|api_key\|token" --include="*.js" --include="*.json" src/ || true

