name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - '**/*.js'
      - '**/*.jsx'
  pull_request:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'src/**'
  workflow_dispatch:

jobs:
  code-analysis:
    runs-on: ubuntu-latest
    name: Análise de Código
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18.x'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run ESLint
      run: |
        npx eslint . --ext .js,.jsx --format json --output-file eslint-report.json || true
        
    - name: Run Prettier check
      run: |
        npx prettier --check "src/**/*.{js,jsx,json,css}" || true
        
    - name: Check code complexity
      run: |
        echo "Verificando complexidade do código..."
        npx complexity-report src/ || true
        
    - name: Upload reports
      uses: actions/upload-artifact@v2
      if: always()
      with:
        name: code-quality-reports
        path: eslint-report.json

  sonarcloud:
    runs-on: ubuntu-latest
    name: Análise SonarCloud
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18.x'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true

