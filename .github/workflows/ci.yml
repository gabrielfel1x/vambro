name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'package.json'
  pull_request:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'package.json'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Diariamente à meia-noite

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build e Testes
    
    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x]
        os: [ubuntu-latest, windows-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Install dependencies
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    
    - name: Build project
      run: npm run build
      continue-on-error: true
      
    - name: Run tests
      run: npm test -- --coverage --watchAll=false
      continue-on-error: true
      
    - name: Security audit
      run: npm audit --audit-level=moderate
      continue-on-error: true
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v2
      if: success()
      with:
        name: build-${{ matrix.node-version }}-${{ matrix.os }}
        path: build/

  security-scan:
    runs-on: ubuntu-latest
    name: Varredura de Segurança
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
      
    - name: Run npm audit
      run: |
        echo "Verificando vulnerabilidades de segurança..."
        npm audit || true
        npm audit --json > audit-report.json || true
        
    - name: Check for known CVEs
      run: |
        echo "Verificando CVEs conhecidos..."
        npx snyk test --json > snyk-report.json || true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v2
      if: always()
      with:
        name: security-reports
        path: |
          audit-report.json
          snyk-report.json

  lint:
    runs-on: ubuntu-latest
    name: Análise de Código
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18.x'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run ESLint
      run: npx eslint . --ext .js,.jsx --format json --output-file eslint-report.json || true
      
    - name: Upload lint report
      uses: actions/upload-artifact@v2
      if: always()
      with:
        name: lint-report
        path: eslint-report.json

