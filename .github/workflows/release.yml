name: Release

on:
  push:
    tags:
      - 'v*'
    paths:
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex: 1.0.0)'
        required: true
      release_notes:
        description: 'Notas da release'
        required: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    name: Criar Release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18.x'
        registry-url: 'https://registry.npmjs.org'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Run tests
      run: npm test -- --watchAll=false
      continue-on-error: true
      
    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          Release ${{ github.ref }}
          
          ${{ github.event.inputs.release_notes }}
        draft: false
        prerelease: false
        
    - name: Publish to NPM
      run: |
        npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    name: Notificar Release
    needs: create-release
    if: success()
    
    steps:
    - name: Send notification
      run: |
        echo "Notificando sobre nova release..."
        # Comandos de notificação aqui

